name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GAME_CONFIGURE_SKIP_APT: "1"
      GAME_CONFIGURE_SKIP_SUBMODULES: "1"
      GAME_TEST_TIMINGS_FILE: test/test-timings-linux-release.json
      GAME_XVFB_JOBS: "4"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/release.yml
      - name: Install Python deps
        run: python3 -m pip install --upgrade pillow==11.2.1
      - name: Smoke test Python deps
        run: python3 -c "from PIL import Image; print(Image.__name__)"
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache clang-format black \
            python3 python3-dev python3-pip python3-venv pybind11-dev python3-pil \
            libboost-dev \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
            xvfb xauth
      - name: Detect ccache metadata
        id: ccache
        shell: bash
        run: |
          compiler_id="$(c++ -dumpmachine)-$(c++ -dumpfullversion -dumpversion)"
          compiler_id="${compiler_id//[^A-Za-z0-9_.-]/-}"
          echo "dir=$(ccache --get-config cache_dir)" >> "${GITHUB_OUTPUT}"
          echo "prefix=${{ runner.os }}-ccache-release-package-${compiler_id}-" >> "${GITHUB_OUTPUT}"
      - name: Restore ccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.ccache.outputs.prefix }}
            ${{ runner.os }}-ccache-
      - name: Cache Python test timings
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ env.GAME_TEST_TIMINGS_FILE }}
          key: ${{ runner.os }}-test-timings-linux-release-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-test-timings-linux-release-
      - name: configure
        run: GAME_CONFIGURE_BUILD_TYPES=Release ./configure.sh
      - name: build test targets
        run: cmake --build cmake-build-release --target _game for_unit_tests -j"$(nproc)"
      - name: test (c++)
        run: ctest --test-dir cmake-build-release --output-on-failure -R for_unit_tests
      - name: test (python)
        run: python3 test.py --suite full --jobs "$(nproc)"
      - name: package
        run: cmake --build cmake-build-release --target package -j"$(nproc)"
      - name: Upload release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: cmake-build-release/fall-of-nouraajd-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.5.0"

      - name: Verify preinstalled Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/build-tools/36.0.0"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"
          test -d "${ANDROID_HOME}/cmake/3.31.5"
          test -d "${ANDROID_HOME}/platforms/android-37" || \
            test -d "${ANDROID_HOME}/platforms/android-37.0" || \
            test -d "${ANDROID_HOME}/platforms/android-37.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool ninja-build pkg-config

      - name: Bootstrap Android dependencies
        shell: bash
        run: bash android/bootstrap-deps.sh

      - name: Assemble ARM64 debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK release asset
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          release_apk="fall-of-nouraajd-${GITHUB_REF_NAME}-android-arm64-debug.apk"
          test -f "${source_apk}"
          cp "${source_apk}" "${release_apk}"
          echo "ANDROID_RELEASE_APK=${release_apk}" >> "${GITHUB_ENV}"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fall-of-nouraajd-android-arm64-debug
          path: ${{ env.ANDROID_RELEASE_APK }}
          if-no-files-found: error

      - name: Attach Android APK to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: ${{ env.ANDROID_RELEASE_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
