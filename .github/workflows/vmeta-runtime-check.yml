name: vmeta audited runtime check
on:
  push:
    branches: [diagnostic/vmeta-startup-20260921]
    paths: [.github/workflows/vmeta-runtime-check.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GAME_CONFIGURE_SKIP_APT: "1"
      GAME_CONFIGURE_SKIP_SUBMODULES: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
      - name: Audit source identity
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD | tee diagnostics/head.txt
          git submodule status --recursive | tee diagnostics/submodules.txt
          git archive --format=tar HEAD src tests test.py CMakeLists.txt configure.sh .clang-format > diagnostics/game-source.tar
          git -C vstd rev-parse HEAD | tee diagnostics/vstd-head.txt
          git -C vstd archive --format=tar HEAD > diagnostics/vstd-source.tar
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: vmeta-audited-source
          path: diagnostics/
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build ccache clang-format black python3-dev python3-venv pybind11-dev libboost-dev libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev xvfb xauth
          python3 -m pip install -r requirements-dev.txt
      - name: Detect compiler cache
        id: ccache
        run: |
          compiler_id="$(c++ -dumpmachine)-$(c++ -dumpfullversion -dumpversion)"
          compiler_id="${compiler_id//[^A-Za-z0-9_.-]/-}"
          echo "dir=$(ccache --get-config cache_dir)" >> "$GITHUB_OUTPUT"
          echo "prefix=${{ runner.os }}-ccache-release-${compiler_id}-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.ccache.outputs.prefix }}
            ${{ runner.os }}-ccache-
      - name: Configure and build
        run: |
          GAME_CONFIGURE_BUILD_TYPES=Release ./configure.sh > diagnostics/configure.log 2>&1 || { tail -100 diagnostics/configure.log; exit 1; }
          cmake --build cmake-build-release --target _game for_unit_tests performance_guard_tests -j"$(nproc)" > diagnostics/build.log 2>&1 || { tail -100 diagnostics/build.log; exit 1; }
      - name: Native regression tests
        continue-on-error: true
        run: |
          ctest --test-dir cmake-build-release --output-on-failure -R for_unit_tests 2>&1 | tee diagnostics/native-tests.log
      - name: Campaign regression
        continue-on-error: true
        run: |
          python3 test.py GameTest.test_mcp_scenario_harness_drives_nouraajd_rolf_gooby 2>&1 | tee diagnostics/campaign-test.log
      - name: Native performance guard
        continue-on-error: true
        run: |
          ctest --test-dir cmake-build-release --output-on-failure --verbose -L performance 2>&1 | tee diagnostics/performance.log
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmeta-audited-runtime
          path: |
            diagnostics/*.log
            diagnostics/*.txt
            cmake-build-release/Testing/Temporary/LastTest.log
