name: android

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "src/**"
      - "res/**"
      - "quest_state.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify preinstalled Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/build-tools/36.0.0"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"
          test -d "${ANDROID_HOME}/cmake/3.31.5"
          test -d "${ANDROID_HOME}/platforms/android-37" || \
            test -d "${ANDROID_HOME}/platforms/android-37.0" || \
            test -d "${ANDROID_HOME}/platforms/android-37.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool ninja-build pkg-config

      - name: Bootstrap Android dependencies
        shell: bash
        run: bash android/bootstrap-deps.sh

      - name: Assemble ARM64 debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fall-of-nouraajd-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
