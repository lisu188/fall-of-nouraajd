name: Historical recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/recover-history.yml
      - recovery/**
      - scripts/recover_history.py
      - scripts/prepare_history_overrides.py
      - scripts/recovery_readme.py
      - scripts/history_rootfs.py
      - scripts/history_workbench.py
      - scripts/history_source_prep.py
      - scripts/history_prepare_console_reader.py
      - scripts/history_prepare_scene_transition.py
      - scripts/history_prepare_python_shutdown.py
      - scripts/history_prepare_trigger_decorator.py
      - scripts/history_prepare_map_position.py
      - scripts/history_prepare_panel_transition.py
      - scripts/history_prepare_text_panel_shutdown.py
      - scripts/history_prepare_sparse_map_transition.py
      - scripts/history_prepare_named_event_transition.py
      - scripts/history_prepare_panel_refresh_transition.py
      - scripts/history_prepare_effect_transition.py
      - scripts/history_prepare_resources_transition.py
      - scripts/history_prepare_script_loader.py
      - scripts/history_prepare_import_hook.py
      - scripts/history_prepare_map_events.py
      - scripts/history_prepare_python_effects.py
      - scripts/history_prepare_class_loaders.py
      - scripts/history_prepare_merged_headers.py
      - scripts/history_prepare_pathfinder_cache.py
      - scripts/history_runtime_configs.py
      - scripts/history_prepare_includes.py
      - scripts/history_prepare_resources.py
      - scripts/history_prepare_reflection.py
      - scripts/history_prepare_coordinates.py
      - scripts/history_prepare_legacy_tiles.py
      - scripts/history_prepare_maps_manifest.py
      - scripts/history_prepare_teleporter.py
      - scripts/history_prepare_legacy_timing.py
      - scripts/history_qmake_compatibility.py
      - scripts/history_static_lto.py
      - scripts/history_state_regression.py
      - scripts/verify_history.py
      - tests/test_history_recovery.py
      - tests/test_history_smoke.py
      - tests/test_history_overrides.py
      - tests/test_history_config.py
      - tests/test_recovery_readme.py
      - tests/test_history_payloads.py
      - tests/test_history_resources.py
      - tests/test_history_rootfs.py
      - tests/test_history_workbench.py
      - tests/test_history_source_prep.py
      - tests/test_history_console_reader.py
      - tests/test_history_scene_transition.py
      - tests/test_history_python_shutdown.py
      - tests/test_history_trigger_decorator.py
      - tests/test_history_map_position.py
      - tests/test_history_panel_transition.py
      - tests/test_history_text_panel_shutdown.py
      - tests/test_history_sparse_map_transition.py
      - tests/test_history_named_event_transition.py
      - tests/test_history_panel_refresh_transition.py
      - tests/test_history_effect_transition.py
      - tests/test_history_resources_transition.py
      - tests/test_history_script_loader.py
      - tests/test_history_import_hook.py
      - tests/test_history_map_events.py
      - tests/test_history_python_effects.py
      - tests/test_history_class_loaders.py
      - tests/test_history_merged_headers.py
      - tests/test_history_runtime_transitions.py
      - tests/test_history_resource_preparation.py
      - tests/test_history_reflection_preparation.py
      - tests/test_history_coordinate_preparation.py
      - tests/test_history_legacy_tiles.py
      - tests/test_history_maps_manifest.py
      - tests/test_history_teleporter_preparation.py
      - tests/test_history_legacy_timing.py
      - tests/test_history_legacy_timing_integration.py
      - tests/fixtures/history_teleporter/**
      - tests/fixtures/history-timing-128/**
      - tests/test_history_prepare_includes.py
      - tests/test_history_qmake_compatibility.py
      - tests/test_history_static_lto.py
      - tests/test_history_movement_completion.py
      - tests/fixtures/history-movement-195/**
      - tests/fixtures/history-state/**
      - tests/test_recovery_workflow.py

permissions:
  contents: read

concurrency:
  group: historical-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Validate recovery tooling
        run: |
          python3 -m unittest tests.test_history_recovery tests.test_history_smoke \
            tests.test_recovery_workflow tests.test_history_overrides \
            tests.test_history_config tests.test_recovery_readme \
            tests.test_history_payloads tests.test_history_resources tests.test_history_rootfs \
            tests.test_history_workbench tests.test_history_source_prep tests.test_history_prepare_includes \
            tests.test_history_qmake_compatibility tests.test_history_resource_preparation \
            tests.test_history_reflection_preparation tests.test_history_maps_manifest tests.test_history_coordinate_preparation \
            tests.test_history_legacy_tiles tests.test_history_teleporter_preparation \
            tests.test_history_legacy_timing tests.test_history_legacy_timing_integration \
            tests.test_history_static_lto tests.test_history_movement_completion \
            tests.test_history_runtime_transitions tests.test_history_merged_headers tests.test_history_console_reader \
            tests.test_history_scene_transition \
            tests.test_history_python_shutdown \
            tests.test_history_trigger_decorator tests.test_history_map_position tests.test_history_panel_transition \
            tests.test_history_text_panel_shutdown tests.test_history_sparse_map_transition \
            tests.test_history_named_event_transition tests.test_history_panel_refresh_transition tests.test_history_effect_transition \
            tests.test_history_resources_transition tests.test_history_script_loader tests.test_history_import_hook tests.test_history_map_events \
            tests.test_history_python_effects tests.test_history_class_loaders
          bash -n recovery/toolchains/build.sh
      - name: Plan exhaustive bounded shards
        id: shards
        run: |
          matrix="$(python3 recovery/toolchains/plan_shards.py --trees-per-shard 16)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Restore identical pinned toolchain image
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/recovery-image
          key: historical-qt5-amd64-v1-${{ hashFiles('recovery/toolchains/Dockerfile', 'recovery/toolchains/build.sh', 'recovery/toolchains/sources.json') }}
      - name: Build and record historical toolchain
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/recovery-image"
          docker build --platform linux/amd64 --progress plain --tag nouraajd-recovery:qt5 recovery/toolchains
          docker image inspect nouraajd-recovery:qt5 > "${RUNNER_TEMP}/recovery-image/image.json"
          docker run --rm --entrypoint cat nouraajd-recovery:qt5 /opt/recovery-installed-packages.txt \
            > "${RUNNER_TEMP}/recovery-image/packages.txt"
          docker save nouraajd-recovery:qt5 | gzip -1 > "${RUNNER_TEMP}/recovery-image/image.tar.gz"
      - name: Cache complete toolchain
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/recovery-image
          key: historical-qt5-amd64-v1-${{ hashFiles('recovery/toolchains/Dockerfile', 'recovery/toolchains/build.sh', 'recovery/toolchains/sources.json') }}
      - name: Share toolchain with validation shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: historical-qt5-toolchain
          path: ${{ runner.temp }}/recovery-image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  recover:
    name: Historical trees ${{ matrix.index }}
    needs: [inventory, toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Obtain the identical historical toolchain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: historical-qt5-toolchain
          path: ${{ runner.temp }}/recovery-image
      - name: Restore toolchain image
        run: gunzip -c "${RUNNER_TEMP}/recovery-image/image.tar.gz" | docker load
      - name: Restore, compile and verify every assigned tree
        env:
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_COUNT: ${{ matrix.count }}
        run: |
          output_dir="${RUNNER_TEMP}/historical-results"
          mkdir -p "${output_dir}"
          image_id="$(docker image inspect --format '{{.Id}}' nouraajd-recovery:qt5)"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --env "GAME_RECOVERY_TOOLCHAIN_ID=${image_id}" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" \
            --volume "${output_dir}:/results" --workdir "${GITHUB_WORKSPACE}" \
            nouraajd-recovery:qt5 scripts/verify_history.py --all \
            --recipes recovery/toolchains/qt5.json \
            --shard-index "${SHARD_INDEX}" --shard-count "${SHARD_COUNT}" \
            --output-dir /results --timeout 30 --build-timeout 1200 --jobs 2
      - name: Retain individual build and startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: historical-results-${{ matrix.index }}
          path: ${{ runner.temp }}/historical-results/
          retention-days: 14
          if-no-files-found: error
